name: Apply Fuelio cost analytics v6 once
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/apply-cost-v6.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply and test category and cost-per-logged-km analytics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_cost_analytics_v6.py')
          s = p.read_text(encoding='utf-8')
          before = "replace(card, '0.1.0-beta.5', '0.1.0-beta.6')"
          after = "p = Path(card)\ns = p.read_text(encoding='utf-8')\nassert s.count('0.1.0-beta.5') == 2\np.write_text(s.replace('0.1.0-beta.5', '0.1.0-beta.6'), encoding='utf-8')"
          assert s.count(before) == 1
          p.write_text(s.replace(before, after), encoding='utf-8')
          PY
          python tools/apply_cost_analytics_v6.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_extrema.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('self.assertEqual(snapshot.monthly_cost_history[0], {"month": "2026-09", "fuel": 1000.0, "other": 200.0, "total": 1200.0})', 'self.assertEqual({k: snapshot.monthly_cost_history[0][k] for k in ("month", "fuel", "other", "total")}, {"month": "2026-09", "fuel": 1000.0, "other": 200.0, "total": 1200.0})')
          s = s.replace('self.assertEqual(snapshot.monthly_cost_history[1], {"month": "2026-08", "fuel": 800.0, "other": 0.0, "total": 800.0})', 'self.assertEqual({k: snapshot.monthly_cost_history[1][k] for k in ("month", "fuel", "other", "total")}, {"month": "2026-08", "fuel": 800.0, "other": 0.0, "total": 800.0})')
          s = s.replace('all(set(month) == {"month", "fuel", "other", "total"} for month in snapshot.monthly_cost_history)', 'all({"month", "fuel", "other", "total"}.issubset(month) for month in snapshot.monthly_cost_history)')
          assert s.count('self.assertEqual(len(keys), 28)') == 1
          s = s.replace('self.assertEqual(len(keys), 28)', 'self.assertEqual(len(keys), 36)')
          p.write_text(s, encoding='utf-8')
          PY
          python -m compileall -q custom_components tests
          python -m unittest discover -s tests -v
          node --check custom_components/fuelio/www/ha-fuelio-card.js
          node tests/test_frontend.mjs
          node tests/test_frontend_real_ids.mjs
          node tests/test_cost_frontend.mjs
          git config user.name 'fuelio-ci'
          git config user.email 'fuelio-ci@users.noreply.github.com'
          git add README.md RELEASE_NOTES.md custom_components/fuelio/parser.py custom_components/fuelio/sensor.py custom_components/fuelio/manifest.json custom_components/fuelio/www/ha-fuelio-card.js tests/test_extrema.py tests/test_cost_analytics.py tests/test_cost_frontend.mjs
          git commit -m 'feat(dev): category breakdown and month/year/lifetime kr per logged km'
          git push origin HEAD:dev
