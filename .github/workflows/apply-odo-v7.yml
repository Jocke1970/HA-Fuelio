name: Apply Fuelio odometer v7 once
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/apply-odo-v7.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Final coverage UI fix and test
        run: |
          set -euo pipefail
          python tools/odometer_coverage_ui_v7.py
          python -m compileall -q custom_components tests
          python -m unittest discover -s tests -v
          node --check custom_components/fuelio/www/ha-fuelio-card.js
          node tests/test_frontend.mjs
          node tests/test_frontend_real_ids.mjs
          node tests/test_cost_frontend.mjs
          git config user.name 'fuelio-ci'
          git config user.email 'fuelio-ci@users.noreply.github.com'
          git add custom_components/fuelio/www/ha-fuelio-card.js tests/test_cost_frontend.mjs
          git commit -m 'fix(dev): show partial ODO periods on ratio tiles'
          git push origin HEAD:dev
