name: Apply Fuelio time-aware v8 once
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/apply-v8-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch, run all synthetic checks, then commit
        run: |
          set -euo pipefail
          python tools/repair_v8.py
          python tools/apply_v8.py
          python tools/finalize_v8.py
          python -m compileall -q custom_components tests
          python -m unittest discover -s tests -v
          node --check custom_components/fuelio/www/ha-fuelio-card.js
          node tests/test_frontend.mjs
          node tests/test_frontend_real_ids.mjs
          node tests/test_cost_frontend.mjs
          git config user.name 'fuelio-ci'
          git config user.email 'fuelio-ci@users.noreply.github.com'
          git add custom_components/fuelio/parser.py custom_components/fuelio/sensor.py custom_components/fuelio/www/ha-fuelio-card.js tests/test_cost_frontend.mjs tests/test_frontend.mjs README.md
          git commit -m 'feat(dev): time-aware fuel estimates and grouped vehicle overview'
          git push origin HEAD:dev
