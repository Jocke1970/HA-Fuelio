name: Publish beta prerelease

on:
  push:
    branches: [beta]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile integration and tests
        run: python -m compileall -q custom_components tests
      - name: Run parser and HACS metadata regression tests
        run: python -m unittest discover -s tests -v
      - name: Check beta version, HACS metadata and matching release notes
        id: version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/fuelio/manifest.json"))["version"])')"
          if [[ ! "$version" =~ ^0\.1\.0-beta\.[0-9]+$ ]]; then
            echo "Skipping release: manifest version is $version"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          hacs = json.loads(Path('hacs.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('custom_components/fuelio/manifest.json').read_text(encoding='utf-8'))
          assert isinstance(hacs, dict) and hacs.get('name') == 'Fuelio', 'Invalid HACS metadata'
          assert manifest['domain'] == 'fuelio', 'Invalid integration manifest'
          PY
          if ! grep -Fq "v${version}" RELEASE_NOTES.md; then
            echo "Skipping release: release notes do not describe v${version}"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Publish GitHub prerelease once
        if: steps.version.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; not overwriting."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "HA-Fuelio $tag" --notes-file RELEASE_NOTES.md
