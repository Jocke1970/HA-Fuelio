name: Convert Fuelio brand JPEG

on:
  push:
    branches: [dev]
    paths:
      - icon.jpeg
      - .github/workflows/brand-icon.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image converter
        run: python -m pip install 'Pillow>=11,<13'
      - name: Convert the source to a proper 256x256 PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path('icon.jpeg')
          if not src.is_file():
              print('No root JPEG: nothing to convert.')
              raise SystemExit(0)
          dst = Path('custom_components/fuelio/brand/icon.png')
          dst.parent.mkdir(parents=True, exist_ok=True)
          with Image.open(src) as original:
              if original.format != 'JPEG':
                  raise ValueError('icon.jpeg is not a JPEG')
              image = ImageOps.exif_transpose(original).convert('RGB')
              image.thumbnail((256, 256), Image.Resampling.LANCZOS)
              square = Image.new('RGB', (256, 256), 'white')
              square.paste(image, ((256 - image.width) // 2, (256 - image.height) // 2))
              square.save(dst, format='PNG', optimize=True)
          with Image.open(dst) as checked:
              assert checked.format == 'PNG' and checked.size == (256, 256)
          src.unlink()
          print('Converted and validated custom_components/fuelio/brand/icon.png; removed root JPEG.')
          PY
      - name: Commit only the icon conversion to dev
        run: |
          git add -A -- icon.jpeg custom_components/fuelio/brand/icon.png
          if git diff --cached --quiet; then
            echo 'No icon changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'brand(dev): convert JPEG into native Fuelio integration icon'
          git push origin HEAD:dev
