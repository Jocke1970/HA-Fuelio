name: Prepare Fuelio beta8 once
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/prepare-beta8-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare version and verify complete prerelease source
        run: |
          set -euo pipefail
          python tools/prepare_v8_release.py
          python -m compileall -q custom_components tests
          python -m unittest discover -s tests -v
          node --check custom_components/fuelio/www/ha-fuelio-card.js
          node tests/test_frontend.mjs
          node tests/test_frontend_real_ids.mjs
          node tests/test_cost_frontend.mjs
          node tests/test_estimate_frontend.mjs
          git config user.name 'fuelio-ci'
          git config user.email 'fuelio-ci@users.noreply.github.com'
          git add custom_components/fuelio/manifest.json custom_components/fuelio/www/ha-fuelio-card.js tests/test_cost_frontend.mjs RELEASE_NOTES.md README.md
          git commit -m 'release(dev): prepare HA-Fuelio v0.1.0-beta.8 candidate'
          git push origin HEAD:dev
