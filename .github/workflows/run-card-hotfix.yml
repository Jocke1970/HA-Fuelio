name: Run Fuelio frontend hotfix
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/run-card-hotfix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply tested code without changing workflow files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/card-hotfix.yml').read_text(encoding='utf-8')
          assert source.count('        run: |') == 1
          script = source.split('        run: |\n', 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.split('\n'))
          marker = "python - <<'PY'\nfrom pathlib import Path\np=Path('.github/workflows/tests.yml')"
          assert script.count(marker) == 1
          start = script.index(marker)
          end = script.index('\nPY\n', start) + len('\nPY\n')
          script = script[:start] + script[end:]
          assert script.count('rm .github/workflows/card-hotfix.yml\n') == 1
          script = script.replace('rm .github/workflows/card-hotfix.yml\n', '')
          assert '.github/workflows/tests.yml' not in script
          Path('/tmp/fuelio-hotfix.sh').write_text('set -euo pipefail\n' + script, encoding='utf-8')
          PY
          bash /tmp/fuelio-hotfix.sh