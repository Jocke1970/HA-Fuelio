calibrate_range:
  name: Calibrate range
  description: Adjust the current tank's theoretical range against the vehicle computer without writing to Fuelio.
  fields:
    entity_id:
      name: Fuelio entity
      description: An entity from the Fuelio configuration to calibrate.
      required: true
      selector:
        entity:
          integration: fuelio
    range_km:
      name: Range
      description: Current remaining range reported by the vehicle computer.
      required: true
      selector:
        number:
          min: 1
          max: 5000
          step: 1
          unit_of_measurement: km
          mode: box

clear_range_calibration:
  name: Clear range calibration
  description: Remove the manual calibration and return to Fuelio's automatic consumption basis.
  fields:
    entity_id:
      name: Fuelio entity
      description: An entity from the Fuelio configuration whose calibration should be cleared.
      required: true
      selector:
        entity:
          integration: fuelio
